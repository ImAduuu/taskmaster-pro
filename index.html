<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaskMaster Pro - Dynamic TODO App</title>
  
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="app-container">
    <!-- Header Section -->
    <header class="app-header">
      <div class="header-left">
        <div class="brand-icon">
          <i class="fas fa-check-double"></i>
        </div>
        <div>
          <h1 class="app-title">TaskMaster Pro</h1>
          <p class="app-subtitle">Organize, track, and complete your tasks seamlessly</p>
        </div>
      </div>
      <button class="btn btn-outline-danger btn-clear-all" onclick="confirmClearAll()">
        <i class="fas fa-trash-sweep me-2"></i>Clear All
      </button>
    </header>

    <!-- Progress Card -->
    <div class="progress-card">
      <div class="progress-info">
        <span class="progress-title">Completion Rate</span>
        <span class="progress-percentage" id="progressPercent">0%</span>
      </div>
      <div class="progress-bar-container">
        <div class="progress-bar-fill" id="progressBar"></div>
      </div>
      <div class="stats-row">
        <div class="stat-item">
          <span class="stat-value" id="totalCount">0</span>
          <span class="stat-label">Total</span>
        </div>
        <div class="stat-divider"></div>
        <div class="stat-item">
          <span class="stat-value text-success" id="completedCount">0</span>
          <span class="stat-label">Completed</span>
        </div>
        <div class="stat-divider"></div>
        <div class="stat-item">
          <span class="stat-value text-warning" id="pendingCount">0</span>
          <span class="stat-label">Pending</span>
        </div>
      </div>
    </div>

    <!-- Action & Filter Bar -->
    <div class="controls-bar">
      <div id="addNew" class="btn-add-new" data-bs-toggle="modal" data-bs-target="#form">
        <i class="fas fa-plus icon-plus"></i>
        <span>Add New Task</span>
      </div>

      <div class="search-filter-box">
        <div class="search-input-wrapper">
          <i class="fas fa-search search-icon"></i>
          <input type="text" id="searchInput" class="search-input" placeholder="Search tasks..." onkeyup="filterTasks()">
        </div>
        <div class="filter-pills">
          <button class="filter-btn active" data-filter="all" onclick="setFilter('all', this)">All</button>
          <button class="filter-btn" data-filter="pending" onclick="setFilter('pending', this)">Pending</button>
          <button class="filter-btn" data-filter="completed" onclick="setFilter('completed', this)">Completed</button>
        </div>
      </div>
    </div>

    <!-- Tasks List Container -->
    <div class="tasks-section">
      <h2 class="section-title">
        <span>Your Tasks</span>
        <span class="task-badge" id="visibleCount">0</span>
      </h2>
      <div id="tasks" class="tasks-grid"></div>
    </div>
  </div>

  <!-- Modal Form -->
  <div class="modal fade" id="form" tabindex="-1" aria-labelledby="formModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content glass-modal">
        <form id="taskForm">
          <div class="modal-header">
            <h5 class="modal-title" id="formModalLabel">
              <i class="fas fa-pen-to-square me-2 text-gradient"></i><span id="modalHeading">Add New Task</span>
            </h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close" onclick="resetForm()"></button>
          </div>
          <div class="modal-body">
            <div id="msg" class="error-msg"></div>

            <div class="form-group mb-3">
              <label for="textInput" class="form-label">Task Title</label>
              <div class="input-icon-wrapper">
                <i class="fas fa-heading input-icon"></i>
                <input type="text" class="custom-input" id="textInput" placeholder="What needs to be done?">
              </div>
            </div>

            <div class="form-row mb-3">
              <div class="form-group flex-fill me-2">
                <label for="dateInput" class="form-label">Due Date</label>
                <div class="input-icon-wrapper">
                  <i class="fas fa-calendar-alt input-icon"></i>
                  <input type="date" class="custom-input" id="dateInput">
                </div>
              </div>
              <div class="form-group flex-fill ms-2">
                <label for="priorityInput" class="form-label">Priority</label>
                <div class="input-icon-wrapper">
                  <i class="fas fa-flag input-icon"></i>
                  <select class="custom-input" id="priorityInput">
                    <option value="low">Low</option>
                    <option value="medium" selected>Medium</option>
                    <option value="high">High</option>
                  </select>
                </div>
              </div>
            </div>

            <div class="form-group mb-2">
              <label for="textarea" class="form-label">Description</label>
              <div class="input-icon-wrapper">
                <i class="fas fa-align-left input-icon textarea-icon"></i>
                <textarea class="custom-input" id="textarea" rows="4" placeholder="Add additional details or notes..."></textarea>
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-dark-cancel" data-bs-dismiss="modal" onclick="resetForm()">Cancel</button>
            <button type="submit" id="add" class="btn btn-gradient-primary">Save Task</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Toast Container -->
  <div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div id="appToast" class="toast custom-toast align-items-center text-white border-0" role="alert" aria-live="assertive" aria-atomic="true">
      <div class="d-flex">
        <div class="toast-body d-flex align-items-center">
          <i id="toastIcon" class="fas fa-info-circle me-2 fs-5"></i>
          <span id="toastMessage">Notification message</span>
        </div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="todo-footer">
    <div class="footer-content">
      <span>Made with <i class="fas fa-heart text-danger"></i> by </span>
      <a href="https://github.com/ImAduuu" target="_blank" rel="noopener noreferrer">Adesh Dsouza</a>
    </div>
  </footer>

  <!-- Bootstrap 5 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Custom JS -->
  <script src="main.js"></script>
</body>
</html>
